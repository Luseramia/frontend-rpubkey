apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-rpubkey
  namespace: web-pubkey
  labels:
    app: frontend-rpubkey
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate  # เปลี่ยนจาก Recreate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend-rpubkey
  template:
    metadata:
      labels:
        app: frontend-rpubkey
      annotations:
        consul.hashicorp.com/connect-inject: "false"
    spec:
      serviceAccountName: frontend-rpubkey
      dnsPolicy: ClusterFirst
      containers:
        - name: frontend-rpubkey
          image: registry.registry.svc.cluster.local:5000/frontend-rpubkey:27latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: ssl-certs
          secret:
            secretName: frontend-rpubkey-secrets
            items:
              - key: privatekey
                path: private.key
                mode: 0600
              - key: certificate
                path: certificate.crt
                mode: 0644
      restartPolicy: Always