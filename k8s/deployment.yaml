apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-rpubkey
  namespace: web-pubkey
  labels:
    app: frontend-rpubkey
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend-rpubkey
  template:
    metadata:
      labels:
        app: frontend-rpubkey
      annotations:
        consul.hashicorp.com/connect-inject: "false" # ปิด Consul injection
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "web-pubkey"
        vault.hashicorp.com/agent-inject-secret-config: "dev-secrets/data/web-pubkey"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "dev-secrets/data/web-pubkey" -}}
          API_TOKEN="{{ .Data.data.privatekey }}"
          {{- end }}
    spec:
      serviceAccountName: frontend-rpubkey
      dnsPolicy: ClusterFirst
      containers:
        - name: frontend-rpubkey
          image: registry.registry.svc.cluster.local:5000/frontend-rpubkey:6
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Always
