apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: frontend-rpubkey-config
  namespace: web-pubkey
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # acme.cert-manager.io/http01-ingress-class: "nginx"
    # nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # cert-manager.io/cluster-issuer: "letsencrypt-dns01"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"  # เปลี่ยนเป็น HTTPS
    nginx.ingress.kubernetes.io/backend-https-verify: "false"  # ปิด verify เพราะ self-signed
    # ปิด cert-manager ไม่ให้แทรกแซง
    cert-manager.io/issuer: ""
    cert-manager.io/cluster-issuer: ""


spec:
  ingressClassName: nginx
  tls:
    - secretName: frontend-rpubkey-ingress-tls
      hosts:
        - tarchunk.win
  rules:
    - host: tarchunk.win        # ✅ ต้องเป็น 'host' ไม่ใช่ 'hosts'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-rpubkey
                port:
                  number: 443
