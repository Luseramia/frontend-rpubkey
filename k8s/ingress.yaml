apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-rpubkey-config
  namespace: n8n
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    acme.cert-manager.io/http01-ingress-class: "nginx"
spec:
  ingressClassName: nginx
  tls:  
    # - secretName: n8n-tls
      hosts:
        - tarchunk.win
  rules:
      hosts:
        - tarchunk.win
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-rpubkey
                port:
                  number: 3000
